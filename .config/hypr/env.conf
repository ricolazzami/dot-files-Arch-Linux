# ==============================================================================
# Environment Variables
# Source this file in your main hyprland configuration
# ==============================================================================

# Toolkit & Wayland backend
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

# Electron / Chromium apps Wayland native
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# Qt theming & platform
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QPA_PLATFORMTHEME,kde
env = XDG_MENU_PREFIX,plasma-

# XDG Desktop Specification
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_DATA_DIRS,$HOME/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:/usr/local/share:/usr/share

# Illogical Impulse / Quickshell
env = qsConfig,ii
env = ILLOGICAL_IMPULSE_VIRTUAL_ENV,$HOME/.local/state/quickshell/.venv
env = QS_WALLPAPER_DIR,$HOME/Pictures/Wallpapers

# Cursor settings
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,24
